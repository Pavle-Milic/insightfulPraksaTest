services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongo:27017/Insightful_Test
      JWT_SECRET: insightful-grocery-store-docker-secret-key-change-me
      JWT_EXPIRATION_MINUTES: 60
      SEED_ENABLED: "true"
      SEED_RESET: "false"
    ports:
      - "8080:8080"

volumes:
  mongo-data:
